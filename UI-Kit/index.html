<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Kit - Help Desk</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Biblioteca de Componentes UI Kit</h1>
        <p>Sistema Help Desk - Data Center</p>
    </header>

<main>
    <section>

    <h2>Botones</h2>

    <button class="btn-primary">
        Botón Primario
    </button>

    <button class="btn-secondary">
        Botón Secundario
    </button>

    <button class="btn-danger">
        Botón Peligro
    </button>

</section>

<section>

    <h2>Formularios</h2>

    <label for="titulo">Título del incidente</label><br>
    <input type="text" id="titulo" placeholder="Ingrese el título del incidente">

    <br><br>

    <label for="categoria">Categoría</label><br>
    <select id="categoria">
        <option>Red</option>
        <option>Hardware</option>
        <option>Software</option>
    </select>

</section>

<section>

    <h2>Tarjeta de Ticket</h2>

    <div class="card">
        <h3>Ticket #001</h3>

        <p><strong>Incidente:</strong> Servidor sin conexión</p>

        <p><strong>Categoría:</strong> Hardware</p>

        <p><strong>Estado:</strong> En proceso</p>
    </div>

</section>

</main>

<footer>

    <p>© 2026 Help Desk</p>

</footer>

</body>

</html>
