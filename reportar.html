<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help Desk Data Center</title>

    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header>
    <h1>Sistema Help Desk Data Center</h1>
</header>

<nav class="navbar">
    <a href="index.html">Inicio</a>
    <a href="reportar.html">Reportar Incidente</a>
    <a href="tickets.html">Tickets</a>
</nav>

<main>

    <section class="card">
        
        <h2>Reporte de Incidentes</h2>

        <form>

            <label for="titulo">Título del incidente:</label><br>
            <input type="text" id="titulo" name="titulo" required>

            <br><br>

            <label for="categoria">Categoría:</label><br>
            <select id="categoria" name="categoria">
                <option value="red">Red</option>
                <option value="hardware">Hardware</option>
                <option value="software">Software</option>
            </select>

            <br><br>

            <label>Nivel de prioridad:</label><br>

            <input type="radio" id="alta" name="prioridad" value="alta">
            <label for="alta">Alta</label>

            <input type="radio" id="media" name="prioridad" value="media">
            <label for="media">Media</label>

            <input type="radio" id="baja" name="prioridad" value="baja">
            <label for="baja">Baja</label>

            <br><br>

            <label for="descripcion">Descripción detallada:</label><br>
            <textarea
                id="descripcion"
                name="descripcion"
                rows="6"
                cols="50">
            </textarea>

            <br><br>

            <button type="submit" class="btn btn-primary">
                Registrar Incidente
            </button>

        </form>

    </section>

</main>

<footer>
    <p>© 2026 Sistema Help Desk Data Center</p>
</footer>

</body>
</html>
